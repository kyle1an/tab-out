<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Out Resize Smoke</title>
    <link rel="stylesheet" href="/extension/dist/assets/app.css" />
  </head>
  <body>
    <div id="appRoot"></div>
    <div id="toastRoot"></div>

    <script>
      window.__tabOutSmokeErrors = []
      window.addEventListener('error', (event) => {
        window.__tabOutSmokeErrors.push(event.message)
      })
      window.addEventListener('unhandledrejection', (event) => {
        window.__tabOutSmokeErrors.push(String(event.reason?.message || event.reason))
      })

      const listeners = {
        addListener() {},
        removeListener() {}
      }
      const workingSetSnapshot = {
        defaultLimit: 8,
        expandedLimit: 16,
        items: [
          {
            key: 'working-set-smoke-1',
            tabId: 3,
            windowId: 1,
            tabUrl: 'https://tab-out-smoke-03.com/docs/3',
            rawUrl: 'https://tab-out-smoke-03.com/docs/3',
            title: 'Working set item with enough tooltip text to prove pointer-click return focus stays quiet after switching away from Tab Out and then returning to the dashboard without hovering the item again',
            displayUrl: 'tab-out-smoke-03.com/docs/3',
            faviconUrl: '',
            dupeCount: 1,
            active: false,
            activeInOtherWindow: false,
            score: 10
          }
        ]
      }
      const tabs = [
        {
          id: 1001,
          url: 'https://app.contentful.com/spaces/smoke/environments/dev2/entries/hover-handoff-one',
          title: 'Hover Handoff Title dev2 extra context',
          favIconUrl: '',
          windowId: 1,
          active: false,
          pinned: false,
          groupId: -1,
          index: 1001
        },
        {
          id: 1002,
          url: 'https://app.contentful.com/spaces/smoke/environments/dev2/entries/hover-handoff-two',
          title: 'Another Handoff Page dev2 sibling context',
          favIconUrl: '',
          windowId: 1,
          active: false,
          pinned: false,
          groupId: -1,
          index: 1002
        },
        ...Array.from({ length: 24 }, (_, index) => {
          const domain = `tab-out-smoke-${String(index + 1).padStart(2, '0')}.com`
          return {
            id: index + 1,
            url: `https://${domain}/docs/${index + 1}`,
            title: index === 0
              ? 'Short title'
              : `Example ${index + 1} with enough tooltip text to prove viewport-edge collision flipping keeps the popup visible`,
            favIconUrl: '',
            windowId: 1,
            active: index === 0,
            pinned: false,
            groupId: -1,
            index
          }
        })]

      window.chrome = {
        bookmarks: {
          getTree: async () => [],
          onCreated: listeners,
          onRemoved: listeners,
          onChanged: listeners,
          onMoved: listeners,
          onChildrenReordered: listeners,
          onImportEnded: listeners
        },
        history: {
          search: async () => [],
          deleteUrl: async () => {},
          onVisited: listeners,
          onVisitRemoved: listeners
        },
        runtime: {
          getURL: (path) => `${window.location.origin}${path}`,
          sendMessage: async (message) => {
            if (message?.type === 'tab-out:get-working-set') {
              return { ok: true, snapshot: workingSetSnapshot }
            }
            return { ok: false }
          }
        },
        storage: {
          local: {
            get: async () => ({}),
            set: async () => {}
          }
        },
        tabGroups: {
          query: async () => [],
          onCreated: listeners,
          onUpdated: listeners,
          onRemoved: listeners,
          onMoved: listeners
        },
        tabs: {
          query: async () => tabs,
          remove: async () => {},
          update: async () => {},
          onCreated: listeners,
          onActivated: listeners,
          onRemoved: listeners,
          onMoved: listeners,
          onAttached: listeners,
          onDetached: listeners,
          onUpdated: listeners
        },
        windows: {
          getAll: async () => [{ id: 1, type: 'normal', focused: true }],
          getCurrent: async () => ({ id: 1, type: 'normal', focused: true }),
          update: async () => {},
          onFocusChanged: listeners
        }
      }
    </script>
    <script type="module" src="/extension/dist/app.js"></script>
  </body>
</html>
