  <body>
    <div id="appRoot"></div>
    <div id="toastRoot"></div>

    <script>
      window.__tabOutSmokeErrors = []
      window.addEventListener('error', (event) => {
        window.__tabOutSmokeErrors.push(event.message)
      })
      window.addEventListener('unhandledrejection', (event) => {
        window.__tabOutSmokeErrors.push(String(event.reason?.message || event.reason))
      })

      function createListeners() {
        const handlers = []
        return {
          addListener(handler) {
            handlers.push(handler)
          },
          removeListener(handler) {
            const index = handlers.indexOf(handler)
            if (index >= 0) handlers.splice(index, 1)
          },
          dispatch(...args) {
            for (const handler of handlers.slice()) handler(...args)
          }
        }
      }
      const listeners = createListeners()
      const tabActivatedListeners = createListeners()
      const workingSetSnapshot = {
        defaultLimit: 8,
        expandedLimit: 16,
        items: [
          {
            key: 'working-set-smoke-1',
            tabId: 3,
            windowId: 1,
            tabUrl: 'https://tab-out-smoke-03.com/docs/3',
            rawUrl: 'https://tab-out-smoke-03.com/docs/3',
            title: 'Working set item with enough tooltip text to prove pointer-click return focus stays quiet after switching away from Tab Out and then returning to the dashboard without hovering the item again',
            displayUrl: 'tab-out-smoke-03.com/docs/3',
            faviconUrl: '',
            dupeCount: 1,
            active: false,
            activeInOtherWindow: false,
            score: 10
          },
          ...Array.from({ length: 11 }, (_, index) => {
            const itemNumber = index + 2
            const tabId = itemNumber + 2
            const domain = `tab-out-smoke-${String(tabId).padStart(2, '0')}.com`
            return {
              key: `working-set-smoke-${itemNumber}`,
              tabId,
              windowId: 1,
              tabUrl: `https://${domain}/docs/${tabId}`,
              rawUrl: `https://${domain}/docs/${tabId}`,
              title: `Working set smoke item ${itemNumber}`,
              displayUrl: `${domain}/docs/${tabId}`,
              faviconUrl: '',
              dupeCount: 1,
              active: false,
              activeInOtherWindow: false,
              score: 10 - itemNumber
            }
          })
        ]
      }
      const tabs = [

          return {

      window.chrome = {
        bookmarks: {
          getTree: async () => [],
          onCreated: listeners,
          onRemoved: listeners,
          onChanged: listeners,
          onMoved: listeners,
          onChildrenReordered: listeners,
          onImportEnded: listeners
        },
        history: {
          search: async () => [],
          deleteUrl: async () => {},
          onVisited: listeners,
          onVisitRemoved: listeners
        },
        runtime: {
          getURL: (path) => `${window.location.origin}${path}`,
          sendMessage: async (message) => {
            if (message?.type === 'tab-out:get-working-set') {
              return { ok: true, snapshot: workingSetSnapshot }
            }
            return { ok: false }
          }
        },
        storage: {
          local: {
            get: async () => ({}),
            set: async () => {}
          }
        },
        tabGroups: {
          query: async () => [],
          onCreated: listeners,
          onUpdated: listeners,
          onRemoved: listeners,
          onMoved: listeners
        },
        tabs: {
          query: async () => tabs,
          remove: async () => {},
          update: async () => {},
          onCreated: listeners,
          onActivated: tabActivatedListeners,
          onRemoved: listeners,
          onMoved: listeners,
          onAttached: listeners,
          onDetached: listeners,
          onUpdated: listeners
        },
        windows: {
          getAll: async () => [{ id: 1, type: 'normal', focused: true }],
          getCurrent: async () => ({ id: 1, type: 'normal', focused: true }),
          update: async () => {},
          onFocusChanged: listeners
        }
      }
      const originalWindowIds = new Map(tabs.map((tab) => [tab.id, tab.windowId]))
      window.__tabOutSmokeSetActiveTab = async (tabId, windowId = 1) => {
        for (const tab of tabs) {
          tab.windowId = originalWindowIds.get(tab.id) ?? tab.windowId
          tab.active = tab.id === tabId
        }
        const activeTab = tabs.find((tab) => tab.id === tabId)
        if (activeTab) activeTab.windowId = windowId
        tabActivatedListeners.dispatch({ tabId, windowId: 1 })
        await new Promise((resolve) => setTimeout(resolve, 350))
      }
    </script>
    <script type="module" src="/extension/dist/app.js"></script>
  </body>
