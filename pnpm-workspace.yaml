packages:
  - '.'

allowBuilds:
  # Verifies the platform executable used by Vite and tsx.
  esbuild: true
  # Preserves Effect's optional native MessagePack fast path.
  msgpackr-extract: true

overrides:
  # Rolldown 1.2.7 folds a deliberately lazy geometry chunk into the app entry.
  rolldown: 1.2.4

minimumReleaseAge: 1440

# These exact releases were selected by the authorized latest-version upgrade
# while they were inside pnpm 11's default 24-hour quarantine window.
minimumReleaseAgeExclude:
  - '@typescript-eslint/types@8.67.0'
  - dependency-cruiser@18.2.0

trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy unprovenanced release; tarball verified against source.
  # Exact integrity is pinned in pnpm-lock.yaml.
  - 'semver@6.3.1'
