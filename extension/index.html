<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Transparent favicon — placed immediately after charset so the
       HTML parser hits it as early as possible, minimizing the window
       where Chrome's default extension icon briefly flashes on load. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>‎</title>

    <!-- Typography: the dashboard uses the user's Chrome "Sans-serif" setting
       (chrome://settings/fonts). The Base UI toast uses the docs fallback stack.
       No web fonts are loaded. -->

    <!-- Vite bundles Tailwind plus the semantic extension styles from
       base.css into one packaged stylesheet. Component class names remain
       stable for code and design discussion. -->
    <link rel="modulepreload" href="dist/app.js" />
    <link rel="stylesheet" href="dist/assets/app.css" />
  </head>
  <body>
    <div id="appRoot">
      <div
        id="filterFocusBootShell"
        class="relative z-1 flex min-h-0 flex-auto flex-col [&[hidden]]:hidden"
        hidden
      >
        <div class="relative z-1 mx-auto grid min-h-0 w-full max-w-(--dashboard-shell-max-width) flex-auto grid-cols-[minmax(calc(220px_+_var(--dashboard-history-edge-gutter)),calc(260px_+_var(--dashboard-history-edge-gutter)))_minmax(0,1fr)] items-stretch gap-4 max-[900px]:[--dashboard-history-edge-gutter:12px] max-[900px]:[--dashboard-page-gutter:20px] max-[900px]:grid-cols-[minmax(0,1fr)] max-[900px]:gap-0">
          <div class="max-[900px]:hidden" aria-hidden="true"></div>
          <div class="col-start-2 flex min-h-0 min-w-0 flex-col pr-(--dashboard-page-gutter) max-[900px]:col-start-1 max-[900px]:px-(--dashboard-page-gutter)">
            <div class="relative z-10 -ml-14 mr-[calc(0px_-_var(--dashboard-edge-bleed))] flex-none py-3 pr-[calc(var(--dashboard-edge-bleed)_+_var(--dashboard-scroll-gutter)_+_var(--dashboard-scrollbar-size))] pl-14 max-[900px]:ml-[calc(0px_-_var(--dashboard-edge-bleed))] max-[900px]:pr-[calc(var(--dashboard-edge-bleed)_+_var(--dashboard-scrollbar-size))] max-[900px]:pl-(--dashboard-edge-bleed)">
              <div class="filter-focus-boot-input-wrap relative isolate inline-flex items-center before:pointer-events-none before:absolute before:inset-0 before:z-0 before:rounded-(--header-control-radius) before:border before:border-input before:drop-shadow-xs before:[corner-shape:squircle] before:content-[''] after:pointer-events-none after:absolute after:inset-0 after:z-0 after:rounded-(--header-control-radius) after:border after:border-blue-500 after:opacity-0 after:drop-shadow-md after:drop-shadow-blue-500/50 after:transition-opacity after:duration-150 after:ease-out after:[corner-shape:squircle] after:content-[''] motion-reduce:after:transition-none [&:has(input:focus-visible)::after]:opacity-100">
                <input
                  id="filterFocusBootInput"
                  class="relative z-1 box-border h-(--header-control-height) w-[280px] rounded-(--header-control-radius) border border-transparent bg-transparent px-3 py-1 text-(length:--header-control-font-size) leading-(--header-control-line-height) text-foreground caret-blue-500 shadow-none transition-colors outline-none [font-family:inherit] [corner-shape:squircle] placeholder:select-none placeholder:text-muted-foreground min-[900px]:max-[960px]:w-[220px] md:text-sm [&::-webkit-search-cancel-button]:[-webkit-appearance:none]"
                  type="search"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="Filter tabs"
                  placeholder="Filter tabs, bookmarks, history…"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="dist/filter-focus-boot.js"></script>

    <!-- Base UI toast mount point for action confirmations. -->
    <div id="toastRoot"></div>

    <!-- Main dashboard logic — Vite builds React + TSX source into this
     packaged local ES module. `type="module"` defers execution until
     DOMContentLoaded automatically. -->
    <script type="module" src="dist/app.js"></script>
  </body>
</html>
